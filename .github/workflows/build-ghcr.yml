name: Build and Push GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build context
        run: |
          pwd
          ls -la
          test -f requirements-docker.txt
          test -f Dockerfile.ghcr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ghcr
          push: true
          tags: |
            ghcr.io/nukota1/hidream-o1-image:latest
            ghcr.io/nukota1/hidream-o1-image:${{ github.sha }}
