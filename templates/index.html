<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v='20260715-catalog5') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">{{ app_name }}</div>
    <div class="model-name">{{ image_model_label }}</div>
  </header>

  <nav class="workflow-tabs" aria-label="制作工程">
    <button id="tab-character" class="workflow-tab" type="button" data-workflow="character" aria-pressed="true">キャラクター生成</button>
    <button id="tab-compose" class="workflow-tab" type="button" data-workflow="compose" aria-pressed="false">背景合成 / 修正</button>
  </nav>

  <div class="workspace">
    <aside class="controls">
      <section id="panel-character" class="workflow-panel">
        <div class="field">
          <label for="character-prompt">キャラクターの要素</label>
          <textarea id="character-prompt" rows="6" placeholder="容姿、髪型、服装、表情、アクセサリーなどを入力"></textarea>
        </div>

        <section class="catalog-panel" aria-labelledby="character-catalog-title">
          <div class="section-label" id="character-catalog-title">プロンプトカタログ</div>
          <div class="catalog-toolbar">
            <select id="character-catalog-category" aria-label="キャラクター用カタログのカテゴリ"></select>
            <select id="character-catalog-subcategory" aria-label="キャラクター用カタログの中分類" disabled></select>
            <input id="character-catalog-query" type="search" placeholder="カタログを検索">
          </div>
          <div id="character-selected" class="selected-prompts" aria-live="polite"></div>
          <div id="character-catalog-results" class="catalog-results" aria-live="polite"></div>
          <button id="character-catalog-more" class="catalog-more" type="button" hidden>さらに読み込む</button>
        </section>

        <label class="toggle-row" for="character-refine-enabled">
          <span>
            <strong>構図と表現をAIで補完</strong>
            <small>日本語は常に英語タグへ変換します</small>
          </span>
          <input id="character-refine-enabled" type="checkbox" {% if refine_default %}checked{% endif %}>
        </label>

        <div class="field">
          <label for="preset">画風テンプレート</label>
          <select id="preset">
            {% for preset_id, preset in presets.items() %}
            <option value="{{ preset_id }}" {% if preset_id == 'bishoujo_game' %}selected{% endif %}>{{ preset.label }}</option>
            {% endfor %}
          </select>
        </div>

        <details open>
          <summary>画風の強さ</summary>
          <div class="slider-field">
            <label for="anime-strength">アニメ・美少女ゲーム風 <output id="anime-strength-value"></output></label>
            <input id="anime-strength" type="range" min="0" max="100">
          </div>
          <div class="slider-field">
            <label for="line-detail">線画・描き込み <output id="line-detail-value"></output></label>
            <input id="line-detail" type="range" min="0" max="100">
          </div>
          <div class="slider-field">
            <label for="color-vividness">色の鮮やかさ <output id="color-vividness-value"></output></label>
            <input id="color-vividness" type="range" min="0" max="100">
          </div>
          <div class="slider-field">
            <label for="photoreal-avoidance">実写化を避ける強さ <output id="photoreal-avoidance-value"></output></label>
            <input id="photoreal-avoidance" type="range" min="0" max="100">
          </div>
        </details>

        <details>
          <summary>詳細設定</summary>
          <div class="field-grid">
            <div class="field">
              <label for="width">幅</label>
              <input id="width" type="number" min="512" max="2048" step="64">
            </div>
            <div class="field">
              <label for="height">高さ</label>
              <input id="height" type="number" min="512" max="2048" step="64">
            </div>
            <div class="field">
              <label for="steps">Steps</label>
              <input id="steps" type="number" min="10" max="60" step="1">
            </div>
            <div class="field">
              <label for="cfg">CFG</label>
              <input id="cfg" type="number" min="1" max="12" step="0.5">
            </div>
            <div class="field">
              <label for="sampler">Sampler</label>
              <select id="sampler">
                <option value="euler_a">Euler A</option>
                <option value="euler">Euler</option>
              </select>
            </div>
            <div class="field">
              <label for="clip-skip">Clip Skip</label>
              <input id="clip-skip" type="number" min="1" max="4" step="1">
            </div>
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" type="number" min="0" value="32">
          </div>
          <div class="field">
            <label for="negative-prompt">Negative prompt</label>
            <textarea id="negative-prompt" rows="4"></textarea>
          </div>
        </details>

        <button id="generate-character" class="primary-command" type="button">立ち絵を生成</button>
      </section>

      <section id="panel-compose" class="workflow-panel" hidden>
        <div class="source-area">
          <div class="section-label">編集元の画像</div>
          <div id="compose-source-preview" class="source-preview" hidden><img id="compose-source-image" alt="編集元の画像"></div>
          <div id="compose-source-empty" class="source-empty">キャラクター生成の結果、または画像ファイルを選択</div>
          <div class="source-actions">
            <button id="use-character-result" type="button">キャラクター生成の結果を使う</button>
            <label class="file-command" for="compose-source-file">画像を選択</label>
            <input id="compose-source-file" type="file" accept="image/*" hidden>
          </div>
        </div>

        <div class="field">
          <label for="compose-prompt">背景・構図・修正内容</label>
          <textarea id="compose-prompt" rows="6" placeholder="背景、ポーズ、カメラ、表情など、今回変更したい内容を入力"></textarea>
        </div>

        <section class="catalog-panel" aria-labelledby="compose-catalog-title">
          <div class="section-label" id="compose-catalog-title">プロンプトカタログ</div>
          <div class="catalog-toolbar">
            <select id="compose-catalog-category" aria-label="背景合成用カタログのカテゴリ"></select>
            <select id="compose-catalog-subcategory" aria-label="背景合成用カタログの中分類" disabled></select>
            <input id="compose-catalog-query" type="search" placeholder="カタログを検索">
          </div>
          <div id="compose-selected" class="selected-prompts" aria-live="polite"></div>
          <div id="compose-catalog-results" class="catalog-results" aria-live="polite"></div>
          <button id="compose-catalog-more" class="catalog-more" type="button" hidden>さらに読み込む</button>
        </section>

        <label class="toggle-row" for="compose-refine-enabled">
          <span>
            <strong>構図と表現をAIで補完</strong>
            <small>キャラクターの未指定要素は維持します</small>
          </span>
          <input id="compose-refine-enabled" type="checkbox" {% if refine_default %}checked{% endif %}>
        </label>

        <div class="field">
          <label for="compose-edit-scope">修正範囲</label>
          <select id="compose-edit-scope">
            <option value="background" selected>背景を作成・合成（人物を保持）</option>
            <option value="full">画像全体を修正（ポーズ変更を含む）</option>
          </select>
        </div>

        <div class="field" id="compose-strength-field">
          <label for="compose-strength">合成・修正の強さ <output id="compose-strength-value">85</output></label>
          <input id="compose-strength" type="range" min="20" max="95" value="85" step="5">
          <small>低いほど元キャラクターを維持し、高いほど背景・構図を変えます</small>
        </div>

        <details>
          <summary>編集マスク</summary>
          <div class="field">
            <label for="compose-mask">白い領域を優先して変更</label>
            <input id="compose-mask" type="file" accept="image/*">
          </div>
        </details>

        <div id="edit-history" class="edit-history"></div>
        <button id="generate-compose" class="primary-command" type="button">背景を合成 / 画像を修正</button>
      </section>

      <div id="error" class="error" hidden></div>
    </aside>

    <main class="result-area">
      <div id="empty" class="empty-state">
        <div class="empty-mark">A</div>
        <p>生成した画像がここに表示されます</p>
      </div>

      <section id="progress" class="progress-area" hidden>
        <div class="progress-copy">
          <strong id="progress-title">準備中</strong>
          <span id="progress-message"></span>
        </div>
        <div class="progress-track"><div id="progress-fill"></div></div>
      </section>

      <section id="result" hidden>
        <div id="result-workflow-label" class="result-workflow-label"></div>
        <div class="image-stage"><img id="result-image" alt="生成画像"></div>
        <div class="result-toolbar">
          <button id="use-result-in-compose" type="button" hidden>この画像で背景合成へ</button>
          <button id="download" type="button">画像を保存</button>
          <button id="save-r2" type="button">R2に保存</button>
        </div>
        <details class="prompt-result">
          <summary>生成に使用したプロンプト</summary>
          <pre id="optimized-prompt"></pre>
        </details>
      </section>
    </main>
  </div>

  <script id="preset-data" type="application/json">{{ presets_json|safe }}</script>
  <script src="{{ url_for('static', filename='app.js', v='20260715-catalog5') }}"></script>
</body>
</html>
