services:
  hidream-o1:
    build:
      context: .
      dockerfile: Dockerfile
    image: hidream-o1-image:local
    container_name: hidream-o1-image
    ports:
      - "127.0.0.1:7861:7861"
    environment:
      HIDREAM_MODEL_PATH: /models/HiDream-O1-Image-Dev
      HIDREAM_MODEL_TYPE: dev
      HIDREAM_HOST: 0.0.0.0
      HIDREAM_PORT: 7861
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      AUTO_PROMPT_OPTIMIZE: "1"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:9b
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_MODEL: google/gemma-4-31b-it:free
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      R2_BUCKET: hidream-o1-generated-images
      R2_ENDPOINT_URL: https://6928e8e09e663e95ad8765360633b3f8.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./models-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    gpus: all
