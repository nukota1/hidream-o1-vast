services:
  janku-studio:
    image: ghcr.io/YOUR_GITHUB_OWNER/hidream-o1-image:latest
    container_name: janku-image-studio
    ports:
      - "7861:7861"
    env_file:
      - ./env.vast
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 7861
    volumes:
      - /workspace/janku-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    gpus: all
    restart: unless-stopped
